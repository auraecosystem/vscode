# /var/www/vscode.dev/html.yaml
version: "3.8"

services:
  vscode-web:
    image: codercom/code-server:latest
    container_name: vscode_web_app
    environment:
      - PASSWORD=change_this_secure_password
      - SUDO_PASSWORD=change_this_admin_password
      - DEFAULT_WORKSPACE=/var/www/html
    volumes:
      - /var/www/vscode.dev/html:/var/www/html
      - /var/www/vscode.dev/config:/home/coder/.config
      - /var/www/vscode.dev/extensions:/home/coder/.local/share/code-server/extensions
    ports:
      - "127.0.0.1:8080:8080"
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "curl -sS http://localhost:8080/healthz || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

  web-proxy:
    image: nginx:alpine
    container_name: vscode_nginx_proxy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/www/vscode.dev/html:/var/www/html:ro
      - /var/www/vscode.dev/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - vscode-web
    restart: always
